name = "wasti-nexus-gateway"
main = "src/index.js"
compatibility_date = "2026-11-26"

[vars]
ALLOWED_ORIGINS = ""
MAX_HYBRID_AGENTS = "12"
REQUEST_TIMEOUT_MS = "45000"
NEXUS_DEPLOYMENT_MODE = "customer"
NEXUS_MEMORY_REPOSITORY = "Nabeelwasti/Wasti-AI-Agent"
NEXUS_MEMORY_BRANCH = "main"
NEXUS_MEMORY_PREFIX = "memory/personal/encrypted"

[[ratelimits]]
name = "NEXUS_RATE_LIMIT"
namespace_id = "672845319"

  [ratelimits.simple]
  limit = 60
  period = 60
