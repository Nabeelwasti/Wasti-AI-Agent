name: Cloudflare Worker CI
on:
  push:
    branches: [main]
    paths: ["cloudflare/worker/**", ".github/workflows/cloudflare-ci.yml"]
  pull_request:
    paths: ["cloudflare/worker/**", ".github/workflows/cloudflare-ci.yml"]
  workflow_dispatch:
permissions:
  contents: read
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - name: Run Worker tests
        working-directory: cloudflare/worker
        run: node --test
