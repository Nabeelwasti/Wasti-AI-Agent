name: WASTI NEXUS signed Android release

on:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: nexus-release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  signed-release:
    name: Build and verify signed release APK
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"
      - uses: android-actions/setup-android@v3
        with:
          packages: "platform-tools"
      - name: Install Android SDK packages
        run: sdkmanager "platforms;android-36" "build-tools;36.0.0"
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "8.13"
      - name: Decode protected release keystore
        env:
          NEXUS_RELEASE_KEYSTORE_BASE64: ${{ secrets.NEXUS_RELEASE_KEYSTORE_BASE64 }}
        run: |
          if [ -z "${NEXUS_RELEASE_KEYSTORE_BASE64:-}" ]; then
            echo "NEXUS_RELEASE_KEYSTORE_BASE64 is not configured."
            exit 1
          fi
          printf '%s' "$NEXUS_RELEASE_KEYSTORE_BASE64" | base64 --decode > "$RUNNER_TEMP/wasti-nexus-release.jks"
          test -s "$RUNNER_TEMP/wasti-nexus-release.jks"
      - name: Assemble signed release APK
        env:
          NEXUS_RELEASE_STORE_FILE: ${{ runner.temp }}/wasti-nexus-release.jks
          NEXUS_RELEASE_STORE_PASSWORD: ${{ secrets.NEXUS_RELEASE_KEYSTORE_PASSWORD }}
          NEXUS_RELEASE_KEY_ALIAS: ${{ secrets.NEXUS_RELEASE_KEY_ALIAS }}
          NEXUS_RELEASE_KEY_PASSWORD: ${{ secrets.NEXUS_RELEASE_KEY_PASSWORD }}
        run: |
          test -n "$NEXUS_RELEASE_STORE_PASSWORD"
          test -n "$NEXUS_RELEASE_KEY_ALIAS"
          test -n "$NEXUS_RELEASE_KEY_PASSWORD"
          gradle -p android --no-daemon assembleRelease
      - name: Verify APK signature
        run: |
          APK=android/app/build/outputs/apk/release/app-release.apk
          test -s "$APK"
          apksigner verify --verbose --print-certs "$APK"
      - name: Upload signed APK
        uses: actions/upload-artifact@v4
        with:
          name: wasti-nexus-signed-release-apk
          path: android/app/build/outputs/apk/release/app-release.apk
          if-no-files-found: error
          retention-days: 30
