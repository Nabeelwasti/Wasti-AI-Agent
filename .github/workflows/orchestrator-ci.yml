name: Orchestrator CI
on:
  push:
    branches: [main]
    paths: ["orchestrator/**", ".github/workflows/orchestrator-ci.yml"]
  pull_request:
    paths: ["orchestrator/**", ".github/workflows/orchestrator-ci.yml"]
  workflow_dispatch:
permissions:
  contents: read
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: orchestrator/requirements-dev.txt
      - name: Install dependencies
        run: pip install -r orchestrator/requirements-dev.txt
      - name: Compile
        run: python -m compileall -q orchestrator/app orchestrator/tests
      - name: Test
        working-directory: orchestrator
        env:
          PYTHONPATH: .
        run: pytest -q
