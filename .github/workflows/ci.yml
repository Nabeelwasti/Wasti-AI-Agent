name: WASTI NEXUS CI

on:
  push:
    branches: [main]
    paths-ignore:
      - "**/*.md"
      - "docs/**"
      - "memory/**"
      - "datasets/**"
  pull_request:
    paths-ignore:
      - "**/*.md"
      - "docs/**"
      - "memory/**"
      - "datasets/**"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: nexus-ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  python:
    name: Python tests and source validation
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: |
            orchestrator/requirements-dev.txt
            models/requirements.txt
      - name: Install test dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install -r orchestrator/requirements-dev.txt
          python -m pip install -r models/requirements.txt
      - name: Orchestrator tests
        working-directory: orchestrator
        env:
          PYTHONPATH: .
        run: python -m pytest -q
      - name: Registry and schema tests
        run: python -m pytest -q tests
      - name: Compile Python sources
        run: python -m compileall -q orchestrator/app models sdks/python
      - name: Validate Termux companion script
        run: bash -n termux/nexus
      - name: Validate JSON files
        run: |
          python -m json.tool models/registry.json > /dev/null
          python -m json.tool memory/schemas/memory-record.schema.json > /dev/null
          python -m json.tool datasets/manifests/dataset-manifest.schema.json > /dev/null
          python - <<'PY'
          import pathlib
          import tomllib

          config = tomllib.loads(pathlib.Path("cloudflare/wrangler.toml").read_text())
          limits = config.get("ratelimits", [])
          binding = next((item for item in limits if item.get("name") == "NEXUS_RATE_LIMIT"), None)
          assert binding is not None, "NEXUS_RATE_LIMIT binding is required in customer mode"
          assert binding.get("simple") == {"limit": 60, "period": 60}, binding
          assert str(binding.get("namespace_id", "")).isdigit(), binding
          PY

  edge:
    name: Cloudflare Worker syntax
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: "22"
      - name: Check Worker JavaScript syntax
        run: node --check cloudflare/src/index.js
      - name: Check client key generator syntax
        run: node --check cloudflare/scripts/create-client-key.mjs
      - name: Run Worker unit tests
        run: node --test cloudflare/tests/*.test.mjs

  android:
    name: Android debug build
    runs-on: ubuntu-latest
    timeout-minutes: 35
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: "17"
      - uses: android-actions/setup-android@v4
        with:
          packages: "platform-tools"
      - name: Install Android SDK packages
        run: sdkmanager "platforms;android-36" "build-tools;36.0.0"
      - uses: gradle/actions/setup-gradle@v6
        with:
          gradle-version: "9.7.0"
      - name: Assemble debug APK
        run: gradle -p android --no-daemon assembleDebug
      - name: Run Android JVM unit tests
        run: gradle -p android --no-daemon testDebugUnitTest
      - name: Validate release signing with an ephemeral CI-only keystore
        env:
          NEXUS_RELEASE_STORE_FILE: ${{ runner.temp }}/nexus-ci-test.jks
          NEXUS_RELEASE_STORE_PASSWORD: ci-test-password
          NEXUS_RELEASE_KEY_ALIAS: nexus-ci-test
          NEXUS_RELEASE_KEY_PASSWORD: ci-test-password
        run: |
          keytool -genkeypair -noprompt -keystore "$NEXUS_RELEASE_STORE_FILE" -storetype JKS \
            -storepass "$NEXUS_RELEASE_STORE_PASSWORD" -keypass "$NEXUS_RELEASE_KEY_PASSWORD" \
            -alias "$NEXUS_RELEASE_KEY_ALIAS" -keyalg RSA -keysize 2048 -validity 2 \
            -dname "CN=WASTI NEXUS CI TEST"
          gradle -p android --no-daemon assembleRelease
          "$ANDROID_HOME/build-tools/36.0.0/apksigner" verify --verbose android/app/build/outputs/apk/release/app-release.apk
          rm -f "$NEXUS_RELEASE_STORE_FILE"
      - name: Upload debug APK
        if: github.event_name == 'push' || github.event_name == 'workflow_dispatch' || startsWith(github.ref, 'refs/tags/')
        uses: actions/upload-artifact@v7
        with:
          name: wasti-nexus-debug-apk
          path: android/app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
          retention-days: 7

  deployment-smoke:
    name: Deployed gateway smoke test
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    needs: [edge]
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Verify public gateway and first-party model binding
        env:
          NEXUS_HEALTH_URL: https://wasti-nexus-gateway.wastinabeel99.workers.dev/healthz
        run: |
          for attempt in {1..8}; do
            if curl --fail --silent --show-error "$NEXUS_HEALTH_URL" -o /tmp/nexus-health.json; then
              break
            fi
            if [ "$attempt" -eq 8 ]; then
              echo "Gateway health check failed after retries."
              exit 1
            fi
            sleep 5
          done
          python - <<'PY'
          import json
          from pathlib import Path
          data = json.loads(Path("/tmp/nexus-health.json").read_text())
          assert data.get("status") == "ok", data
          assert data.get("service") == "wasti-nexus-gateway", data
          assert data.get("configured_models") == 2, data
          assert data.get("model_ids") == ["nexus-gemma-4-26b-a4b", "nexus-qwen-3.8-27b"], data
          assert not any("llama-3.2" in model_id for model_id in data.get("model_ids", [])), data
          print("Gateway is reachable; active model IDs:", data["model_ids"])
          PY
          unauth_status=$(curl --silent --output /tmp/nexus-unauth.json --write-out "%{http_code}" https://wasti-nexus-gateway.wastinabeel99.workers.dev/v1/models)
          test "$unauth_status" = "401" || { echo "Expected protected model catalogue to return HTTP 401, got $unauth_status"; cat /tmp/nexus-unauth.json; exit 1; }
      - name: Verify authenticated live model generation
        env:
          NEXUS_API_KEY: ${{ secrets.NEXUS_API_KEY }}
          NEXUS_CHAT_URL: https://wasti-nexus-gateway.wastinabeel99.workers.dev/v1/chat/completions
        run: |
          if [ -z "${NEXUS_API_KEY:-}" ]; then
            echo "::warning::NEXUS_API_KEY repository secret is not configured; authenticated generation smoke test skipped."
            exit 0
          fi
          for model in nexus-gemma-4-26b-a4b nexus-qwen-3.8-27b; do
            payload=$(printf '{"model":"%s","messages":[{"role":"user","content":"Reply with exactly: NEXUS_GATEWAY_GENERATION_OK"}],"stream":false,"max_tokens":128,"temperature":0}' "$model")
            curl --fail --silent --show-error \
              -H "Authorization: Bearer ${NEXUS_API_KEY}" \
              -H "Content-Type: application/json" \
              --data "${payload}" "${NEXUS_CHAT_URL}" \
              --output "/tmp/${model}.json"
          done
          python - <<'PY'
          import json
          from pathlib import Path

          for model in ("nexus-gemma-4-26b-a4b", "nexus-qwen-3.8-27b"):
              payload = json.loads(Path(f"/tmp/{model}.json").read_text())
              content = payload["choices"][0]["message"]["content"]
              assert isinstance(content, str) and content.strip(), payload
              assert payload.get("model") == model, payload
              print("Authenticated live generation succeeded:", model)
          PY
