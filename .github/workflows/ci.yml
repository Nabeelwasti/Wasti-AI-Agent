name: WASTI NEXUS CI
on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:
jobs:
  orchestrator:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: pip install -r orchestrator/requirements-dev.txt
      - run: cd orchestrator && PYTHONPATH=. pytest -q
      - run: python -m compileall -q orchestrator/app models sdks/python
      - run: pytest -q tests/test_registry.py
      - run: python -c "import json,pathlib; d=json.loads(pathlib.Path('models/registry.json').read_text()); assert len(d['families'])==12; assert len({x['id'] for x in d['families']})==12; print('12 model family registry: valid')"
  android:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: android-actions/setup-android@v3
      - run: sdkmanager "platforms;android-35" "build-tools;35.0.0"
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'
      - run: gradle -p android assembleDebug
