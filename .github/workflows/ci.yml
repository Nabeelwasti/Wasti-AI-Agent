name: WASTI NEXUS CI

on:
  push:
    branches: [main]
    paths-ignore:
      - "**/*.md"
      - "docs/**"
      - "memory/**"
      - "datasets/**"
  pull_request:
    paths-ignore:
      - "**/*.md"
      - "docs/**"
      - "memory/**"
      - "datasets/**"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: nexus-ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  python:
    name: Python tests and source validation
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: |
            orchestrator/requirements-dev.txt
            models/requirements.txt
      - name: Install test dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install -r orchestrator/requirements-dev.txt
          python -m pip install -r models/requirements.txt
      - name: Orchestrator tests
        working-directory: orchestrator
        env:
          PYTHONPATH: .
        run: python -m pytest -q
      - name: Registry and schema tests
        run: python -m pytest -q tests
      - name: Compile Python sources
        run: python -m compileall -q orchestrator/app models sdks/python
      - name: Validate JSON files
        run: |
          python -m json.tool models/registry.json > /dev/null
          python -m json.tool memory/schemas/memory-record.schema.json > /dev/null
          python -m json.tool datasets/manifests/dataset-manifest.schema.json > /dev/null
          python -c "import pathlib,tomllib; tomllib.loads(pathlib.Path('cloudflare/wrangler.toml').read_text())"

  edge:
    name: Cloudflare Worker syntax
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - name: Check Worker JavaScript syntax
        run: node --check cloudflare/src/index.js
      - name: Run Worker unit tests
        run: node --test cloudflare/tests/*.test.mjs

  android:
    name: Android debug build
    runs-on: ubuntu-latest
    timeout-minutes: 35
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"
      - uses: android-actions/setup-android@v3
        with:
          packages: "platform-tools"
      - name: Install Android SDK packages
        run: sdkmanager "platforms;android-36" "build-tools;36.0.0"
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "8.13"
      - name: Assemble debug APK
        run: gradle -p android --no-daemon assembleDebug
      - name: Upload debug APK
        if: github.event_name == 'workflow_dispatch' || startsWith(github.ref, 'refs/tags/')
        uses: actions/upload-artifact@v4
        with:
          name: wasti-nexus-debug-apk
          path: android/app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
          retention-days: 1
